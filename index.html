<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pixel Racer</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#14161f;--panel:#232636;--ink:#f4f1de;--acc:#ffd23f;--acc2:#e63946}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161f;--panel:#232636;--ink:#f4f1de}}
:root[data-theme="dark"]{--bg:#14161f;--panel:#232636;--ink:#f4f1de}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:'Press Start 2P',ui-monospace,Menlo,monospace;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(10,12,20,.75);text-align:center;overflow-y:auto;box-sizing:border-box}
.ov.on{display:flex}
.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
h1,h2{margin:0 0 8px;color:var(--acc);text-shadow:4px 4px 0 var(--acc2);line-height:1.4}
h1{font-size:clamp(22px,7vw,42px)}h2{font-size:clamp(16px,5vw,28px)}
.btn{font:inherit;font-size:clamp(11px,3vw,15px);color:#111;background:var(--acc);border:3px solid #111;padding:14px 22px;min-width:min(260px,70vw);box-shadow:0 5px 0 #7a5f00;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #7a5f00}
.btn.alt{background:#e9e4c8;box-shadow:0 5px 0 #8a856c}
#cars{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px}
.card{background:var(--panel);border:4px solid #111;padding:10px;width:110px;font-size:9px;cursor:pointer;line-height:1.8}
.card.sel{border-color:var(--acc)}
.card canvas{width:50px;height:80px;image-rendering:pixelated;display:block;margin:0 auto 8px}
.st{font-size:7px;color:#b9bdd3;text-align:left}
i{display:inline-block;width:6px;height:6px;background:var(--acc);margin-right:2px}i.o{background:#454a63}
#hud{position:fixed;left:0;right:0;top:0;display:none;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none;font-size:clamp(9px,2.6vw,13px);text-shadow:2px 2px 0 #000;box-sizing:border-box}
#hud div{line-height:1.8}
#pbtn{pointer-events:auto;font:inherit;font-size:14px;color:#111;background:var(--acc);border:3px solid #111;padding:10px 12px;cursor:pointer}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);pointer-events:none;box-sizing:border-box}
.pb{pointer-events:auto;touch-action:none;width:clamp(68px,20vmin,110px);height:clamp(68px,20vmin,110px);font:inherit;font-size:clamp(24px,7vmin,38px);color:#111;background:var(--acc);border:4px solid #111;box-shadow:0 5px 0 #7a5f00;opacity:.85;cursor:pointer}
.pb.on{transform:translateY(4px);box-shadow:0 1px 0 #7a5f00;opacity:1}
#hint{font-size:8px;color:#b9bdd3;line-height:1.8}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud"><div><span id="sc">SKOR 0</span><br><span id="kmh">0 KM/J</span></div><button id="pbtn" aria-label="Pengaturan">II</button></div>

<div id="pad"><button class="pb" id="bL" aria-label="Kiri">◀</button><button class="pb" id="bR" aria-label="Kanan">▶</button></div>

<div id="menu" class="ov on">
  <h1>PIXEL<br>RACER</h1>
  <button class="btn" id="bPlay">▶ PLAY</button>
  <button class="btn alt" id="bPick">PILIH MOBIL</button>
  <div id="hint">PC: PANAH / A D · HP: SENTUH KIRI / KANAN<br>TOMBOL ◀ ▶ DI LAYAR JUGA BISA<br>ESC / P = PENGATURAN</div>
</div>

<div id="select" class="ov">
  <h2>PILIH MOBIL</h2>
  <div id="cars"></div>
  <button class="btn" id="bBack">KEMBALI</button>
</div>

<div id="pause" class="ov">
  <h2 id="ptitle">PAUSE</h2>
  <div id="ptxt" style="font-size:11px;line-height:2"></div>
  <button class="btn" id="bCont">LANJUTKAN</button>
  <button class="btn alt" id="bRest">ULANG</button>
  <button class="btn alt" id="bMenu">MAIN MENU</button>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const LW=28,RW=84;
let S,W,H,RX;

const CARS=[
 {n:'MERAH',b:'#e63946',d:'#9d1c28',s:3,h:3},
 {n:'BIRU',b:'#3a86ff',d:'#1d4fa8',s:2,h:5},
 {n:'KUNING',b:'#ffd23f',d:'#b8901a',s:4,h:2},
 {n:'HIJAU',b:'#2ec4b6',d:'#17756c',s:5,h:3},
 {n:'UNGU',b:'#b56cff',d:'#6b2fb0',s:4,h:4},
 {n:'PUTIH',b:'#f1f1f1',d:'#9a9aa8',s:3,h:4}
];
const SPR=[
 "..bbbbbb..",
 ".LbbbbbbL.",
 "tbbbbbbbbt",
 "tbwwwwwwbt",
 "tbwwwwwwbt",
 "tbbbbbbbbt",
 "tbbddddbbt",
 "tbbddddbbt",
 "tbbbbbbbbt",
 "tbwwwwwwbt",
 "tbbbbbbbbt",
 "tbbbbbbbbt",
 "tbbddddbbt",
 ".bbbbbbbb.",
 ".RbbbbbbR.",
 "..bbbbbb.."
];
const cache={};
function sprite(b,d){
 const k=b+d; if(cache[k])return cache[k];
 const c=document.createElement('canvas');c.width=10;c.height=16;
 const x=c.getContext('2d');
 const pal={b:b,d:d,w:'#9bd6ff',t:'#15151a',L:'#fff3a0',R:'#ff3b3b'};
 SPR.forEach((r,y)=>{for(let i=0;i<10;i++){const p=pal[r[i]];if(p){x.fillStyle=p;x.fillRect(i,y,1,1);}}});
 return cache[k]=c;
}
const ENEMY=['#8d99ae','#f77f00','#06d6a0','#ef476f','#118ab2','#c9ada7','#90be6d'];

let sel=0,best=0;
try{sel=Math.min(CARS.length-1,+localStorage.getItem('pxcar')||0);best=+localStorage.getItem('pxbest')||0;}catch(e){}

let st='menu',g=null,last=0,off=0;
let kl=0,kr=0,tl=0,tr=0,bl=0,br=0;

function resize(){
 S=Math.max(2,Math.floor(Math.min(innerWidth/110,innerHeight/150)));
 W=Math.round(innerWidth/S);H=Math.round(innerHeight/S);
 cv.width=W;cv.height=H;RX=Math.floor((W-RW)/2);
 if(g)g.y=H-34;
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,150));
resize();

function fs(){
 try{
  const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;
  if(f&&!document.fullscreenElement&&!document.webkitFullscreenElement){const p=f.call(e);if(p&&p.catch)p.catch(()=>{});}
 }catch(e){}
}
function ov(id){['menu','select','pause'].forEach(k=>$(k).classList.toggle('on',k===id));}

function play(){
 fs();
 g={x:(RW-10)/2,y:H-34,sp:50+CARS[sel].s*15,vx:0,t:0,d:0,en:[],sc:0,tm:.6};
 st='play';ov(null);$('hud').style.display='flex';$('pad').style.display='flex';
}
function pause(){
 if(st!=='play')return;
 st='pause';$('ptitle').textContent='PAUSE';$('ptxt').textContent='';
 $('bCont').style.display='';ov('pause');
}
function resume(){if(st!=='pause')return;st='play';ov(null);}
function toMenu(){st='menu';g=null;$('hud').style.display='none';$('pad').style.display='none';ov('menu');}
function over(){
 st='over';
 if(g.sc>best){best=g.sc;try{localStorage.setItem('pxbest',best);}catch(e){}}
 $('ptitle').textContent='GAME OVER';
 $('ptxt').innerHTML='SKOR '+g.sc+'<br>TERBAIK '+best;
 $('bCont').style.display='none';ov('pause');
}

function spawn(){
 const l=Math.floor(Math.random()*3);
 const near=g.en.filter(e=>e.y<60);
 if(near.some(e=>e.l===l&&e.y<40)){g.tm=.1;return;}
 const lanes=new Set(near.map(e=>e.l));lanes.add(l);
 if(lanes.size>=3){g.tm=.15;return;}
 const c=ENEMY[Math.floor(Math.random()*ENEMY.length)];
 g.en.push({l:l,x:l*LW+9,y:-20,k:.35+Math.random()*.3,s:sprite(c,'#2b2b38')});
}

function update(dt){
 g.t+=dt;
 const car=CARS[sel];
 g.sp=Math.min(80+car.s*36,g.sp+(3+car.s*1.5)*dt);
 off+=g.sp*dt;g.d+=g.sp*dt;g.sc=Math.floor(g.d/10);
 const dir=(kr||tr||br)-(kl||tl||bl);
 const tv=dir*(40+car.h*28);
 g.vx+=(tv-g.vx)*Math.min(1,(4+car.h*3)*dt);
 g.x+=g.vx*dt;
 if(g.x<3){g.x=3;g.vx=0;}else if(g.x>RW-13){g.x=RW-13;g.vx=0;}
 g.tm-=dt;
 if(g.tm<=0){spawn();if(g.tm<=0)g.tm=Math.max(.2,Math.max(.3,1-g.t*.006)*(.8+Math.random()*.5)*Math.min(1.4,110/g.sp));}
 for(const e of g.en){
  e.y+=g.sp*(1-e.k)*dt;
  if(Math.abs(e.x-g.x)<8&&Math.abs(e.y-g.y)<14){over();return;}
 }
 g.en=g.en.filter(e=>e.y<H+24);
 $('sc').textContent='SKOR '+g.sc;
 $('kmh').textContent=Math.round(g.sp*1.2)+' KM/J';
}

function tree(x,y){
 ctx.fillStyle='#5a3a1a';ctx.fillRect(x+4,y+8,2,4);
 ctx.fillStyle='#1f5f26';ctx.fillRect(x,y,10,9);ctx.fillRect(x+2,y-2,6,2);
 ctx.fillStyle='#2e8a37';ctx.fillRect(x+2,y+1,3,2);
}

function draw(){
 const o=Math.floor(off);
 ctx.fillStyle='#2f7d32';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#37903b';
 for(let y=-32+o%32;y<H;y+=32)ctx.fillRect(0,y,W,16);
 const n=Math.ceil((H+40)/40)+1;
 for(let side=0;side<2;side++)for(let c=0;c<12;c++){
  const bx=side?RX+RW+14+c*26:RX-24-c*26;
  if(bx<-12||bx>W)break;
  for(let i=0;i<n;i++){
   if((c*31+i*17+side*7)%5>1)continue;
   tree(bx+((c*13+i*7)%9),((i*40+o)%(H+40))-20);
  }
 }
 ctx.fillStyle='#3b3b47';ctx.fillRect(RX,0,RW,H);
 for(let y=-16+o%16;y<H;y+=16){
  ctx.fillStyle='#e63946';ctx.fillRect(RX-3,y,3,8);ctx.fillRect(RX+RW,y,3,8);
  ctx.fillStyle='#f1f1f1';ctx.fillRect(RX-3,y+8,3,8);ctx.fillRect(RX+RW,y+8,3,8);
 }
 ctx.fillStyle='#e8e8e8';
 for(let l=1;l<3;l++)for(let y=-24+o%24;y<H;y+=24)ctx.fillRect(RX+l*LW-1,y,2,12);
 const car=CARS[sel],sp=sprite(car.b,car.d);
 if(g){
  for(const e of g.en)ctx.drawImage(e.s,RX+Math.round(e.x),Math.round(e.y));
  ctx.drawImage(sp,RX+Math.round(g.x),Math.round(g.y));
 }else{
  ctx.drawImage(sp,RX+37,H-34);
 }
}

function loop(t){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(t-last)/1000||0);last=t;
 if(st==='play')update(dt);else if(st==='menu')off+=60*dt;
 draw();
}

function bar(n){return '<i></i>'.repeat(n)+'<i class="o"></i>'.repeat(5-n);}
function buildCars(){
 const box=$('cars');box.innerHTML='';
 CARS.forEach((c,i)=>{
  const d=document.createElement('div');d.className='card'+(i===sel?' sel':'');
  const p=document.createElement('canvas');p.width=10;p.height=16;
  p.getContext('2d').drawImage(sprite(c.b,c.d),0,0);
  d.appendChild(p);
  d.insertAdjacentHTML('beforeend','<div>'+c.n+'</div><div class="st">KEC '+bar(c.s)+'</div><div class="st">MAKS '+Math.round((80+c.s*36)*1.2)+' KM/J</div><div class="st">KEMUDI '+bar(c.h)+'</div>');
  d.onclick=()=>{sel=i;try{localStorage.setItem('pxcar',i);}catch(e){}buildCars();};
  box.appendChild(d);
 });
}

$('bPlay').onclick=play;
$('bPick').onclick=()=>{buildCars();ov('select');};
$('bBack').onclick=()=>ov('menu');
$('pbtn').onclick=pause;
$('bCont').onclick=resume;
$('bRest').onclick=play;
$('bMenu').onclick=toMenu;

addEventListener('keydown',e=>{
 const k=e.key;
 if(k==='ArrowLeft'||k==='a'||k==='A')kl=1;
 else if(k==='ArrowRight'||k==='d'||k==='D')kr=1;
 else if(k==='Escape'||k==='p'||k==='P'){st==='play'?pause():resume();}
 if(k.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>{
 const k=e.key;
 if(k==='ArrowLeft'||k==='a'||k==='A')kl=0;
 else if(k==='ArrowRight'||k==='d'||k==='D')kr=0;
});
function tp(e){
 if(e.target.closest&&e.target.closest('button,.card'))return;
 if(e.type==='pointerup'||e.type==='pointercancel'){tl=tr=0;return;}
 if(e.type==='pointermove'&&!e.buttons)return;
 const l=e.clientX<innerWidth/2;tl=l?1:0;tr=l?0:1;
}
['pointerdown','pointermove','pointerup','pointercancel'].forEach(k=>addEventListener(k,tp));
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
addEventListener('blur',pause);
addEventListener('contextmenu',e=>e.preventDefault());

function hold(id,set){
 const b=$(id);
 const on=e=>{e.preventDefault();set(1);b.classList.add('on');};
 const off=()=>{set(0);b.classList.remove('on');};
 b.addEventListener('pointerdown',on);
 ['pointerup','pointerleave','pointercancel'].forEach(k=>b.addEventListener(k,off));
}
hold('bL',v=>bl=v);hold('bR',v=>br=v);
function release(){bl=br=kl=kr=tl=tr=0;$('bL').classList.remove('on');$('bR').classList.remove('on');}
addEventListener('blur',release);

requestAnimationFrame(loop);
</script>
</body>
</html>
